name: .NET Desktop Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: "SQL prototipo.slnx"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Compute build version
      id: version
      shell: pwsh
      run: |
        $date = Get-Date -Format 'yyyy.MM.dd'
        $sha = "${{ github.sha }}".Substring(0,7)
        $info = "1.0.0+$date.$sha"
        echo "info=$info" >> $env:GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore "$env:Solution_Name"

    - name: Build
      run: dotnet build "$env:Solution_Name" --configuration ${{ matrix.configuration }} --no-restore -p:InformationalVersion=${{ steps.version.outputs.info }}

    - name: Publish single-file exe (framework-dependent win-x64)
      run: dotnet publish "SQL prototipo/SQL prototipo.csproj" --configuration Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:InformationalVersion=${{ steps.version.outputs.info }} --output publish

    - name: Upload exe
      uses: actions/upload-artifact@v4
      with:
        name: SQL-prototipo-exe
        path: publish/*.exe
